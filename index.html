<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABHI INDUSTRIES BENGALURU EMPLOYEES DATABASE MANAGEMENT SYSTEM</title>
    <!-- Bootstrap 5 CSS Framework -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        :root {
            --navy-blue: #0d2346;
            --corporate-yellow: #f1b813;
        }
        body {
            background-color: var(--navy-blue);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 15px;
        }
        .system-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }
        .main-header-banner {
            background-color: #1d4ed8;
            color: #ffffff;
            font-weight: 700;
            padding: 12px 20px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border-radius: 4px 4px 0 0;
            text-transform: uppercase;
        }
        .split-card {
            background: #f3f4f6;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
        }
        .form-column {
            border-right: 2px solid #e5e7eb;
            padding-right: 30px;
        }
        @media (max-width: 768px) {
            .form-column { border-right: none; padding-right: 0; }
        }
        .logo-column {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 20px;
        }
        .brand-logo-img {
            max-width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
        }
        .form-group-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .field-label {
            width: 180px;
            font-weight: 600;
            color: var(--navy-blue);
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        .field-separator {
            width: 20px;
            font-weight: 600;
            color: var(--navy-blue);
            text-align: center;
        }
        .field-input-box {
            flex: 1;
        }
        .form-control, .form-select {
            border: 1px solid #9ca3af;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.9rem;
            background-color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
        }
        .btn-submit-record {
            background-color: #1d4ed8;
            color: white;
            font-weight: 700;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-submit-record:hover {
            background-color: #1e40af;
        }
        .ledger-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 25px;
            margin-top: 30px;
        }
        .table th {
            background-color: var(--navy-blue) !important;
            color: white !important;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .table td {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="system-wrapper">
        <!-- Top Blue Header Title Layout -->
        <div class="main-header-banner">
            ABHI INDUSTRIES BENGALURU EMPLOYEES DATABASE MANAGEMENT SYSTEM
        </div>

        <!-- Split Screen Flex Form Structure Card -->
        <div class="split-card">
            <div class="row g-4">
                
                <!-- Left Input Fields Column -->
                <div class="col-md-7 form-column">
                    <form id="empForm">
                        
                        <div class="form-group-row">
                            <label class="field-label">SL No</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="slNo" class="form-control" required></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Employee Name</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="empName" class="form-control" required></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">EMP ID</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="empId" class="form-control" required></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Designation</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><select id="designation" class="form-select"></select></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Department</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><select id="department" class="form-select"></select></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Employment Type</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box">
                                <select id="empType" class="form-select">
                                    <option value="On Roll">On Roll</option>
                                    <option value="Contract Basis">Contract Basis</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">DOJ</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="date" id="doj" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Phone No.</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="phone" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Aadhar No.</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="aadhar" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">PAN No.</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="pan" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">ESIC No.</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="esic" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">UAN No.</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="uan" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Bank Name</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="bank" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Account Number</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="account" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">IFSC Code</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="text" id="ifsc" class="form-control"></div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Date of Left the Job</label>
                            <span class="field-separator">:</span>
                            <div class="field-input-box"><input type="date" id="dateLeft" class="form-control"></div>
                        </div>
