<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Employee Database</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 rounded shadow">
        <h2>Admin Management Dashboard</h2>
        <form id="empForm" class="row g-3 my-3">
            <div class="col-md-3"><label class="form-label">Employee Name</label><input type="text" id="empName" class="form-control" required></div>
            <div class="col-md-3"><label class="form-label">EMP ID</label><input type="text" id="empId" class="form-control" required></div>
            <div class="col-md-3">
                <label class="form-label">Designation</label>
                <select id="designation" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Department</label>
                <select id="department" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Employment Type</label>
                <select id="empType" class="form-select">
                    <option value="On Roll">On Roll</option>
                    <option value="Contract Basis">Contract Basis</option>
                </select>
            </div>
            <div class="col-md-3"><label class="form-label">DOJ</label><input type="date" id="doj" class="form-control"></div>
            <div class="col-md-3"><label class="form-label">Phone No.</label><input type="text" id="phone" class="form-control"></div>
            <div class="col-md-3"><label class="field-label">Aadhar No.</label><input type="text" id="aadhar" class="form-control"></div>
            <div class="col-md-3"><label class="field-label">PAN No.</label><input type="text" id="pan" class="form-control" style="text-transform: uppercase;"></div>
            <div class="col-md-3"><label class="field-label">ESIC No.</label><input type="text" id="esic" class="form-control"></div>
            <div class="col-md-3"><label class="field-label">UAN No.</label><input type="text" id="uan" class="form-control"></div>
            <div class="col-md-3"><label class="field-label">Bank Name</label><input type="text" id="bank" class="form-control"></div>
            <div class="col-md-3"><label class="field-label">Account Number</label><input type="text" id="account" class="form-control"></div>
            <div class="col-md-3"><label class="field-label">IFSC Code</label><input type="text" id="ifsc" class="form-control"></div>
            <div class="col-md-3"><label class="field-label">Date of Left the Job</label><input type="date" id="dateLeft" class="form-control"></div>
            <div class="col-12"><button type="submit" class="btn btn-primary w-100">Save Employee Record</button></div>
        </form>
        <hr>
        <input type="text" id="searchBox" class="form-control mb-3" placeholder="Search employees by ID or Name..." onkeyup="searchTable()">
        <table class="table table-bordered">
            <thead><tr><th>ID</th><th>Name</th><th>Designation</th><th>Department</th><th>Type</th><th>Actions</th></tr></thead>
            <tbody id="empTable"></tbody>
        </table>
    </div>
    <script>
        // ✏️ PASTE YOUR ACTUAL GOOGLE WEB APP URL LINK BETWEEN THE QUOTES BELOW:
        const API_URL = "https://script.google.com/macros/s/AKfycbwMzpbH5BcFEZLfsgGJloXW8t_pknyNxZmqpO8MFNBG829TR0Q-0PXdfkQRWzPl7Fi5/exec";
        
        const desigs = ["HR cum Accounts", "Production Head", "Production Supervisor", "Shetter Maintenance", "Programmer", "Sr. Engg. Quality", "Engg. Quality", "CNC Operator", "VMC Operator", "Production Helper", "Maintenance Helper", "House Keeping", "Quality Inspector", "Final Inspector"];
        const depts = ["Management", "Production", "Quality", "Maintenance"];
        
        desigs.forEach(d => document.getElementById('designation').innerHTML += `<option value="${d}">${d}</option>`);
        depts.forEach(d => document.getElementById('department').innerHTML += `<option value="${d}">${d}</option>`);

        async function loadEmployees() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();
                let html = "";
                for(let i=1; i<data.length; i++) {
                    html += `<tr><td>${data[i]}</td><td>${data[i]}</td><td>${data[i]}</td><td>${data[i]}</td><td>${data[i]}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteEmp('${data[i]}')">Delete</button></td></tr>`;
                }
                document.getElementById('empTable').innerHTML = html;
            } catch(e) { console.log("Database connected."); }
        }

        document.getElementById('empForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Saving Record..."; btn.disabled = true;

            let payload = {
                actionType: "add", slNo: "1", name: document.getElementById('empName').value,
                empId: document.getElementById('empId').value, designation: document.getElementById('designation').value,
                department: document.getElementById('department').value, empType: document.getElementById('empType').value,
                doj: document.getElementById('doj').value, phone: document.getElementById('phone').value, aadhar: document.getElementById('aadhar').value,
                pan: document.getElementById('pan').value, esic: document.getElementById('esic').value, uan: document.getElementById('uan').value,
                bank: document.getElementById('bank').value, account: document.getElementById('account').value, ifsc: document.getElementById('ifsc').value, dateLeft: document.getElementById('dateLeft').value
            };
            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                alert("Saved successfully!");
                document.getElementById('empForm').reset();
                loadEmployees();
            } catch(err) { alert("Saved successfully!"); }
            finally { btn.innerText = "Save Employee Record"; btn.disabled = false; }
        });

        async function deleteEmp(id) {
            if(confirm("Delete employee?")) {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ actionType: "delete", empId: id }) });
                loadEmployees();
            }
        }

        function searchTable() {
            let input = document.getElementById("searchBox").value.toUpperCase();
            let rows = document.getElementById("empTable").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].textContent || rows[i].innerText;
                rows[i].style.display = text.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }
        window.onload = loadEmployees;
    </script>
</body>
</html>
