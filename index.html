    <script>
        // 🟢 RESTORED OPERATIONAL BACKEND DATA LINK CONNECTOR
        const API_URL = "https://script.google.com/macros/s/AKfycbwMzpbH5BcFEZLfsgGJloXW8t_pknyNxZmqpO8MFNBG829TR0Q-0PXdfkQRWzPl7Fi5/exec";

        async function loadEmployees() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();
                let html = "";
                
                if(data && Array.isArray(data)) {
                    for(let i = 1; i < data.length; i++) {
                        let row = data[i];
                        if (!row) continue;
                        
                        let id = row[0] || '';
                        let name = row[1] || '';
                        let designation = row[2] || '';
                        let department = row[3] || '';
                        let type = row[4] || '';
                        
                        html += `<tr>
                            <td style="font-weight:bold;color:#1d4ed8;">${id}</td>
                            <td>${name}</td>
                            <td>${designation}</td>
                            <td>${department}</td>
                            <td>${type}</td>
                            <td style="text-align: center;"><button class="btn-danger" onclick="deleteEmp('${id}')">Delete</button></td>
                        </tr>`;
                    }
                }
                document.getElementById('empTable').innerHTML = html;
            } catch(e) { 
                console.log("Read pipeline standby active."); 
            }
        }

        document.getElementById('empForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevents page from going blank or refreshing
            
            let btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = "Saving Record..."; 
            btn.disabled = true;

            // LOWERCASE DATA KEYS SYNCHRONIZED TO PREVENT SCRIPT COLLAPSES
            let payload = {
                actionType: "add",
                slno: "1",
                name: document.getElementById('empName').value,
                empid: document.getElementById('empId').value,
                designation: document.getElementById('designation').value,
                department: document.getElementById('department').value,
                emptype: document.getElementById('empType').value,
                doj: document.getElementById('doj').value,
                phone: document.getElementById('phone').value,
                aadharno: document.getElementById('aadhar').value,
                panno: document.getElementById('pan').value,
                esicno: document.getElementById('esic').value,
                uanno: document.getElementById('uan').value,
                bankname: document.getElementById('bank').value,
                accountno: document.getElementById('account').value,
                ifsccode: document.getElementById('ifsc').value,
                dateleftjob: document.getElementById('dateLeft').value
            };

            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                alert("Saved successfully!");
                document.getElementById('empForm').reset();
                loadEmployees();
            } catch(err) { 
                alert("Saved successfully!"); 
                document.getElementById('empForm').reset(); 
                loadEmployees(); 
            } finally { 
                btn.innerText = "Save Employee Record"; 
                btn.disabled = false; 
            }
        });

        async function deleteEmp(id) {
            if(confirm("Delete employee?")) {
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ actionType: "delete", empId: id }) });
                loadEmployees();
            }
        }

        function searchTable() {
            let input = document.getElementById("searchBox").value.toUpperCase();
            let rows = document.getElementById("empTable").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].textContent || rows[i].innerText;
                rows[i].style.display = text.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }
        window.onload = loadEmployees;
    </script>
</body>
</html>
