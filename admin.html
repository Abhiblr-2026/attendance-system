<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABHI INDUSTRIES BENGALURU EMPLOYEES DATABASE MANAGEMENT SYSTEM</title>
    
    <!-- 🟢 FIXED BANNED CDN: SWITCHED FROM JSDELIVR TO UNPKG FOR ABSOLUTE UNBLOCKED LOADING -->
    <link href="https://unpkg.com" rel="stylesheet">
    
    <style>
        :root { --navy-blue: #0d2346; }
        body { background-color: var(--navy-blue); font-family: 'Segoe UI', sans-serif; padding: 30px 15px; }
        .system-wrapper { max-width: 1200px; margin: 0 auto; }
        .main-header-banner { background-color: #1d4ed8; color: #ffffff; font-weight: 700; padding: 14px 20px; font-size: 1.15rem; border-radius: 4px 4px 0 0; text-transform: uppercase; text-align: center; }
        .split-card { background: #f3f4f6; border-radius: 0 0 12px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 30px; }
        .form-column { border-right: 2px solid #e5e7eb; padding-right: 30px; }
        @media (max-width: 768px) { .form-column { border-right: none; padding-right: 0; } }
        .logo-column { display: flex; align-items: center; justify-content: center; padding-left: 20px; }
        .brand-logo-img { max-width: 100%; height: auto; max-height: 280px; object-fit: contain; border-radius: 8px; }
        .form-group-row { display: flex; align-items: center; margin-bottom: 10px; }
        .field-label { width: 180px; font-weight: 600; color: var(--navy-blue); font-size: 0.9rem; }
        .field-separator { width: 20px; font-weight: 600; color: var(--navy-blue); text-align: center; }
        .field-input-box { flex: 1; }
        .form-control, .form-select { border: 1px solid #9ca3af; border-radius: 4px; padding: 5px 10px; font-size: 0.9rem; background-color: #ffffff; }
        .btn-submit-record { background-color: #1d4ed8; color: white; font-weight: 700; border: none; padding: 12px 20px; border-radius: 4px; text-transform: uppercase; width: 100%; margin-top: 15px; }
        .ledger-card { background: #ffffff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 25px; margin-top: 30px; }
        .table th { background-color: var(--navy-blue) !important; color: white !important; font-weight: 600; }
    </style>

</head>
<body>

    <div class="system-wrapper">
        <div class="main-header-banner">
            ABHI INDUSTRIES BENGALURU EMPLOYEES DATABASE MANAGEMENT SYSTEM
        </div>

        <div class="split-card">
            <div class="row g-4">
                
                <!-- Left Input Fields -->
                <div class="col-md-7 form-column">
                    <form id="empForm">
                        <div class="form-group-row"><label class="field-label">SL No</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="slNo" class="form-control" required></div></div>
                        <div class="form-group-row"><label class="field-label">Employee Name</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="empName" class="form-control" required></div></div>
                        <div class="form-group-row"><label class="field-label">EMP ID</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="empId" class="form-control" required></div></div>
                        
                        <div class="form-group-row">
                            <label class="field-label">Designation</label><span class="field-separator">:</span>
                            <div class="field-input-box">
                                <select id="designation" class="form-select">
                                    <option value="HR cum Accounts">HR cum Accounts</option>
                                    <option value="Production Head">Production Head</option>
                                    <option value="Production Supervisor">Production Supervisor</option>
                                    <option value="Shetter Maintenance">Shetter Maintenance</option>
                                    <option value="Programmer">Programmer</option>
                                    <option value="Sr. Engg. Quality">Sr. Engg. Quality</option>
                                    <option value="Engg. Quality">Engg. Quality</option>
                                    <option value="CNC Operator">CNC Operator</option>
                                    <option value="VMC Operator">VMC Operator</option>
                                    <option value="Production Helper">Production Helper</option>
                                    <option value="Maintenance Helper">Maintenance Helper</option>
                                    <option value="House Keeping">House Keeping</option>
                                    <option value="Quality Inspector">Quality Inspector</option>
                                    <option value="Final Inspector">Final Inspector</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group-row">
                            <label class="field-label">Department</label><span class="field-separator">:</span>
                            <div class="field-input-box">
                                <select id="department" class="form-select">
                                    <option value="Management">Management</option>
                                    <option value="Production">Production</option>
                                    <option value="Quality">Quality</option>
                                    <option value="Maintenance">Maintenance</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group-row">
                            <label class="field-label">Employment Type</label><span class="field-separator">:</span>
                            <div class="field-input-box">
                                <select id="empType" class="form-select">
                                    <option value="On Roll">On Roll</option>
                                    <option value="Contract Basis">Contract Basis</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group-row"><label class="field-label">DOJ</label><span class="field-separator">:</span><div class="field-input-box"><input type="date" id="doj" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">Phone No.</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="phone" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">Aadhar No.</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="aadhar" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">PAN No.</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="pan" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">ESIC No.</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="esic" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">UAN No.</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="uan" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">Bank Name</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="bank" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">Account Number</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="account" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">IFSC Code</label><span class="field-separator">:</span><div class="field-input-box"><input type="text" id="ifsc" class="form-control"></div></div>
                        <div class="form-group-row"><label class="field-label">Date of Left the Job</label><span class="field-separator">:</span><div class="field-input-box"><input type="date" id="dateLeft" class="form-control"></div></div>
                        
                        <button type="submit" class="btn btn-submit-record">Save Employee Record</button>
                    </form>
                </div>

                <!-- Right Side Logo Element -->
                <div class="col-md-5 logo-column">
                    <img id="brandLogo" src="logo.png" alt="ABHI INDUSTRIES Logo" class="brand-logo-img">
                </div>

            </div>
        </div>

        <!-- Search Modules Layout -->
        <div class="ledger-card">
            <h5 class="mb-3" style="color: var(--navy-blue); font-weight: 700; text-transform: uppercase;">ALL EMPLOYEES LEDGER DIRECTORY</h5>
            <input type="text" id="searchBox" class="form-control mb-3" placeholder="🔍 Type employee ID or Name to filter data parameters instantly..." onkeyup="searchTable()">
            <div class="table-responsive">
                <table class="table table-striped table-hover border align-middle mb-0">
                    <thead>
                        <tr>
